<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistencias</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    

</head>
<body class="page-surface">

<div class="container mt-5">

    <h2 class="text-center mb-4">Registro de Asistencias</h2>

    <div class="table-responsive">

        <table class="table table-bordered table-hover shadow page-card">

            <thead class="table-dark">

                <tr>

                    <th>Nombre</th>
                    <th>Matrícula</th>
                    <th>Carrera</th>
                    <th>Grupo</th>
                    <th>Fecha</th>
                    <th>Hora</th>
                    <th>Acciones</th>

                </tr>

            </thead>

            <tbody id="tablaAsistencias">

            </tbody>

        </table>

    </div>

</div>

<script type="module">

// ================= FIREBASE =================

import { db } from "./firebase-config.js";
import {
        collection,
        onSnapshot,
    doc,
    deleteDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

let unsubAsistencias = null;

// ================= CARGAR =================

function cargarAsistencias(){

    const tabla = document.getElementById("tablaAsistencias");

    if (unsubAsistencias) {
        unsubAsistencias();
    }

    unsubAsistencias = onSnapshot(collection(db, "asistencias"), (snapshot) => {

        tabla.innerHTML = "";

        snapshot.forEach((documento)=>{

            let asistencia = documento.data();

            tabla.innerHTML += `

        <tr>

            <td>${asistencia.nombre}</td>
            <td>${asistencia.matricula}</td>
            <td>${asistencia.carrera}</td>
            <td>${asistencia.grupo}</td>
            <td>${asistencia.fecha}</td>
            <td>${asistencia.hora}</td>
            <td>
                <button class="btn btn-sm btn-danger" onclick="eliminarAsistencia('${documento.id}')">
                    Borrar
                </button>
            </td>

        </tr>

        `;

        });

    });

}

// ================= ELIMINAR =================

async function eliminarAsistencia(id){

    if(!confirm("¿Seguro que deseas borrar esta asistencia?")){
        return;
    }

    await deleteDoc(doc(db, "asistencias", id));

}

window.eliminarAsistencia = eliminarAsistencia;

// ================= INICIAR =================

cargarAsistencias();

window.addEventListener("beforeunload", () => {
    if (unsubAsistencias) {
        unsubAsistencias();
    }
});

</script>

</body>
</html>
